name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Nombrar el .jar
        run: |
          VERSION=$(grep -m1 '^version=' src/main/resources/META-INF/mods.toml | cut -d'"' -f2)
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)" "dist/Mob-Leveling-K32-1.20.1-v${VERSION}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: Mob-Leveling-K32
          path: dist/*.jar

      - name: Publicar en Releases (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
